<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Post — Varun Naudiyal</title>
<link rel="stylesheet" href="assets/style.css">

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- KaTeX for LaTeX rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>

<nav>
  <a href="index.html" class="brand">Varun Naudiyal</a>
  <div class="links">
    <a href="index.html">About</a>
    <a href="cv.html">CV</a>
    <a href="projects.html">Projects</a>
    <a href="blog.html" class="active">Blog</a>
  </div>
</nav>

<main>
  <p><a href="blog.html">&larr; Back to Blog</a></p>
  <div class="meta" id="post-meta" style="color:var(--muted); margin-bottom: 6px;"></div>
  <div id="content">Loading…</div>
</main>

<footer>
  © <span id="year"></span> Varun Naudiyal.
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const contentDiv = document.getElementById('content');

  // Pulls $$...$$, \[...\], \(...\), and $...$ out of the markdown BEFORE
  // marked.js parses it, so blank lines / underscores / asterisks inside
  // math can never be misread as markdown syntax (paragraph breaks,
  // emphasis, etc). The placeholders are swapped back in after parsing,
  // untouched, and then KaTeX renders them.
  function renderMarkdownWithMath(mdText, container) {
    const mathBlocks = [];

    const protectedText = mdText
      // $$...$$ (display math, can span multiple lines/paragraphs)
      .replace(/\$\$[\s\S]+?\$\$/g, (match) => {
        mathBlocks.push(match);
        return `%%MATHBLOCK${mathBlocks.length - 1}%%`;
      })
      // \[...\] (display math)
      .replace(/\\\[[\s\S]+?\\\]/g, (match) => {
        mathBlocks.push(match);
        return `%%MATHBLOCK${mathBlocks.length - 1}%%`;
      })
      // \(...\) (inline math)
      .replace(/\\\([\s\S]+?\\\)/g, (match) => {
        mathBlocks.push(match);
        return `%%MATHBLOCK${mathBlocks.length - 1}%%`;
      })
      // $...$ (inline math, single line only, not $$)
      .replace(/(?<!\$)\$(?!\$)[^\n$]+?\$(?!\$)/g, (match) => {
        mathBlocks.push(match);
        return `%%MATHBLOCK${mathBlocks.length - 1}%%`;
      });

    let html = marked.parse(protectedText);

    // Restore math verbatim, after markdown has already run
    html = html.replace(/%%MATHBLOCK(\d+)%%/g, (_, i) => mathBlocks[Number(i)]);

    container.innerHTML = html;

    renderMathInElement(container, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  }

  if (!slug) {
    contentDiv.innerHTML = '<p>No post specified.</p>';
  } else {
    // Load metadata for date/title/tags
    fetch('posts-index.json')
      .then(r => r.json())
      .then(posts => {
        const meta = posts.find(p => p.slug === slug);
        if (meta) {
          document.getElementById('page-title').textContent = meta.title + ' — Your Name';
          document.getElementById('post-meta').textContent =
            meta.date + (meta.tags ? ' · ' + meta.tags.join(', ') : '');
        }
      });

    // Load and render the markdown post
    fetch(`posts/${slug}.md`)
      .then(r => {
        if (!r.ok) throw new Error('Post not found');
        return r.text();
      })
      .then(md => {
        renderMarkdownWithMath(md, contentDiv);
      })
      .catch(err => {
        contentDiv.innerHTML = `<p>Could not load post: ${err.message}</p>`;
      });
  }
</script>

</body>
</html>
